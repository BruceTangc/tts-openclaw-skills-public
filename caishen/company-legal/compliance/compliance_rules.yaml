# 企业合规检查清单

company_governance:
  name: 公司治理
  checks:
    - 营业执照与经营范围是否匹配当前业务
    - 股东信息与股权结构是否清晰
    - 法定代表人与授权委托是否有效
    - 公司章程是否有特殊限制（对外担保、关联交易等）

contract_management:
  name: 合同管理
  checks:
    - 合同是否有统一编号与归档
    - 是否经过必要审批（金额阈值、法务审核）
    - 合同到期日是否有提醒机制
    - 是否留存签署页与关键附件原件/扫描件

labor:
  name: 劳动合规
  checks:
    - 劳动合同是否全员签署
    - 是否签署保密协议 / 竞业限制协议（关键岗位）
    - 社保与公积金缴纳是否合规
    - 加班、休假、解除流程是否有书面记录

intellectual_property:
  name: 知识产权
  checks:
    - 商标、专利、软件著作权是否登记在公司名下
    - 员工职务成果归属是否在劳动合同或专门协议中明确
    - 是否有对外许可或被许可的书面协议

data_security:
  name: 数据安全与个人信息
  checks:
    - 是否收集个人信息，有无隐私政策与告知同意
    - 数据存储与访问权限是否最小化
    - 是否涉及重要数据或跨境传输，有无合规评估
    - 合作方数据处理是否有协议约束

anti_bribery:
  name: 反商业贿赂
  checks:
    - 对外合同是否普遍包含廉洁条款
    - 是否有内部接待、礼品、返佣管理制度
    - 高风险岗位是否有定期合规培训
