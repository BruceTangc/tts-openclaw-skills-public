# 合同审核标准流程

steps:
  - id: 1
    name: 基础信息检查
    checks:
      - 合同主体全称与统一社会信用代码
      - 签署人是否有授权
      - 合同名称与类型是否匹配
      - 签署日期与有效期

  - id: 2
    name: 商业核心条款
    checks:
      - 标的、数量、质量、交付时间
      - 价格与付款方式
      - 发票与税务处理

  - id: 3
    name: 风险条款扫描
    checks:
      - 对照 review_rules.yaml 进行关键词与语义匹配
      - 计算风险评分（risk_engine.yaml）
      - 标注 P0 / P1 / P2 问题

  - id: 4
    name: 特殊场景检查
    checks:
      - 是否涉及数据处理 / 个人信息
      - 是否涉及知识产权转移或许可
      - 是否涉及股权、融资、担保
      - 是否有关联交易迹象

  - id: 5
    name: 输出审核报告
    format: |
      【合同基本信息】
      【风险评分】xx/100（等级）
      【高风险问题】（P0优先）
      【修改建议】
      【谈判重点】
      【总体建议】（是否建议律师复核）
