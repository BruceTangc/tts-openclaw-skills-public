# 合同谈判优先级策略

P0:
  name: 必须修改（原则上不接受原条款）
  description: 直接关系重大经济利益或法律风险，必须争取修改
  conditions:
    - 无限责任或责任无上限
    - 100% 预付款或极高预付比例
    - 知识产权完全归对方且无使用许可
    - 对方拥有无条件单方解除权
    - 明显对自己不利的管辖约定且无对等
    - 数据可被对方任意使用或出境且无限制

P1:
  name: 重点修改（优先争取）
  description: 对风险或商业利益有明显影响，应积极谈判
  conditions:
    - 验收标准模糊或完全主观
    - 服务范围 / 工作边界不清
    - 违约责任明显不对等
    - 保密期限过短
    - 付款节点严重滞后
    - 缺少反商业贿赂或数据安全条款

P2:
  name: 可接受或文字优化
  description: 不影响核心利益，可妥协或仅做文字完善
  conditions:
    - 纯格式、排版问题
    - 不影响实质权利的措辞优化
    - 对方要求的合理说明性条款
    - 对等的通知与送达条款

# 谈判原则（按优先级）
priority_order:
  - 钱（付款、价格、结算）
  - 责任（违约、赔偿上限）
  - 权利（IP、数据、使用权）
  - 控制权（解除、变更、验收主导权）
  - 退出机制（终止后的安排）
