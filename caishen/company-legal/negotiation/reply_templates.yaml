# 常用谈判回复话术模板

p0_liability:
  scenario: 对方要求我方承担无限责任
  reply: |
    关于责任条款，我方理解保护双方权益的重要性。为公平起见，建议将任何一方的累计赔偿责任上限设定为不超过本合同项下已实际支付的费用总额，并排除间接损失与利润损失（故意或重大过失除外）。这是目前行业较为常见的安排，也便于双方准确评估风险。请贵方考虑。

p0_payment:
  scenario: 对方要求全额预付
  reply: |
    关于付款方式，全额预付对我方资金安排与风险控制压力较大。建议采用阶段付款：合同签订后支付 30%，阶段验收后支付 40%，最终验收合格后支付 30%。这样既能保障贵方启动项目，也能与交付进度匹配。盼贵方理解并支持。

p0_ip:
  scenario: 知识产权完全归对方
  reply: |
    关于知识产权归属，本项目系我方委托并支付对价完成，相关成果的知识产权宜归我方所有。贵方原有的工具、框架与通用组件权利仍归贵方，并授予我方必要的使用许可。请贵方确认是否可按此原则调整。

p1_acceptance:
  scenario: 验收标准模糊
  reply: |
    为减少后续争议，建议在合同或附件中明确可客观衡量的验收标准与验收流程，并约定不合格时的整改期限。这对双方都更清晰，也有利于项目顺利推进。

general_polite_close:
  reply: |
    以上意见供贵方参考。我方始终秉持合作共赢原则，期待尽快就合同条款达成一致，推动合作落地。如有需要，可安排电话或会议进一步沟通。
