# 常用保护性条款库（企业视角）

payment:
  risk: 预付款过高或付款节点不利
  replace: |
    双方同意采用阶段付款方式：
    1. 合同签订后 X 个工作日内，甲方支付合同总金额的 30% 作为预付款；
    2. 阶段成果验收合格后 X 个工作日内，甲方支付 40%；
    3. 最终验收合格并收到发票后 X 个工作日内，甲方支付剩余 30%。

acceptance:
  risk: 缺少明确验收标准
  replace: |
    乙方完成交付后，甲方应在 X 个工作日内按照本合同约定的验收标准进行验收。
    验收不合格的，甲方应书面说明理由，乙方应在合理期限内完成整改并重新提交验收。
    逾期未反馈视为验收合格。

ip_ownership:
  risk: 成果知识产权归属不清
  replace: |
    除非另有书面约定，本项目项下产生的全部成果（包括但不限于代码、文档、设计、数据、专利、软件著作权）的知识产权归甲方所有。
    乙方保留其预先拥有的工具、框架与通用组件的权利，并授予甲方非独占、永久、不可撤销的使用许可。

liability_cap:
  risk: 责任无上限
  replace: |
    任何一方在本合同项下的累计赔偿责任上限不超过本合同项下甲方已实际支付的费用总额。
    任何一方均不对间接损失、利润损失、数据丢失、商誉损失承担责任（故意或重大过失除外）。

confidentiality:
  risk: 保密期限过短或范围不清
  replace: |
    双方应对在合作过程中知悉的对方商业秘密承担保密义务。
    保密期限为合同终止后五（5）年，或直至该信息进入公有领域为止（以较早者为准）。
    核心技术秘密的保密期限可另行书面约定。

termination:
  risk: 单方任意解除
  replace: |
    除本合同另有约定外，任何一方不得无故单方解除合同。
    一方严重违约且在收到书面通知后 X 日内仍未纠正的，守约方有权书面通知解除合同，并要求违约方承担相应责任。

anti_bribery:
  risk: 缺少合规条款
  replace: |
    双方承诺严格遵守适用的反商业贿赂与反腐败法律法规。
    任何一方均不得为获取不正当利益向对方或相关第三方提供、承诺或收受贿赂。
    违反本条款的，守约方有权立即解除合同并要求赔偿。

data_security:
  risk: 数据处理条款缺失
  replace: |
    乙方处理甲方或甲方用户数据的，应仅在履行合同必要范围内处理，并采取符合法律法规要求的安全保护措施。
    未经甲方书面同意，乙方不得将数据用于其他目的，不得向第三方提供，不得跨境传输。
